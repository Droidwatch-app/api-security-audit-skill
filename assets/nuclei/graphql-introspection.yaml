id: audit-graphql-introspection

info:
  name: GraphQL con introspección habilitada
  author: api-security-audit
  severity: info
  description: |
    Detecta endpoints GraphQL que responden a introspección. En producción es informativo/bajo
    salvo que el esquema exponga operaciones internas (revisar autorización por campo: API1/API3/API5).
    Consulta mínima y de solo lectura.
  classification:
    cwe-id: CWE-200
  tags: api,graphql,exposure,audit

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/v1/graphql"
    headers:
      Content-Type: application/json
    body: '{"query":"{__schema{queryType{name}}}"}'
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "__schema"
          - "queryType"
        condition: and
